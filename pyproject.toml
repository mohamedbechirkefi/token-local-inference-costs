# SPDX-License-Identifier: LicenseRef-TOKEN-NC-Research-1.0
[project]
name = "token-lab"
version = "0.1.0"
description = "TOKEN: local inference economics (quality, latency and resource use of local model configurations)."
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "Mohamed Bechir Kefi" }]
dependencies = [
    "numpy==2.3.4",
    "psutil==7.1.0",
    "jsonschema==4.25.1",
]

[project.scripts]
token-lab = "token_lab.cli:main"

[dependency-groups]
dev = ["pytest==8.4.2"]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/token_lab"]

[tool.uv]
# Only versions published at least two weeks before the M0 session (2026-11-24).
exclude-newer = "2026-11-10T00:00:00Z"

[tool.pytest.ini_options]
testpaths = ["tests"]
